# Deploy code to westeros.ir over FTPS with lftp. Runs ONLY when started by hand
# (GitHub > Actions > "Deploy to westeros.ir" > Run workflow).
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD. The FTP account's home is /home/wester/public_html.
# Never deletes anything on the server (no --delete): uploads, configs, wiki images stay safe.
name: Deploy to westeros.ir

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only list what would change)"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp git-restore-mtime

      # Give each file its last-commit time, so later runs only upload files that changed.
      - name: Restore file times from git
        run: git restore-mtime --quiet --commit-time

      - name: Upload with lftp
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --only-newer --no-perms --parallel=4 --verbose=1 $DRY \
            --exclude-glob .git/ --exclude-glob .github/ \
            --exclude-glob .git* --exclude-glob .cpanel.yml \
            --exclude-glob wp-config.php --exclude-glob .maintenance \
            --exclude ^\.htaccess$ \
            --exclude ^wiki/LocalSettings\.php$ \
            --exclude ^wp-content/uploads/ --exclude ^wiki/images/ \
            --exclude ^forums/ --exclude ^dl/ --exclude ^downloads/ --exclude ^beyondthewall/ \
            ./ ./
          bye
          LFTP
