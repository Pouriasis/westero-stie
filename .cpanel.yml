---
deployment:
  tasks:
    - export DEPLOYPATH=/home/wester/public_html/
    # rsync is not installed on this host, so copy with a tar pipe.
    # Overwrites changed files; deletes NOTHING, so uploads/config/forum on the server stay untouched.
    - set -o pipefail; /bin/tar --exclude=./.git --exclude=./.github --exclude=./.cpanel.yml --exclude=./.gitignore -cf - . | /bin/tar --no-overwrite-dir -xf - -C $DEPLOYPATH
